openapi: 3.1.0
info:
  title: 4Tax USSD Callback API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security: [{gatewayKey: []}]
paths:
  /ussd/callback/grapevine:
    post:
      operationId: grapevineCallback
      description: Grapevine v1.3 prototype XML. Operator-specific compatibility must be confirmed before live activation.
      requestBody:
        required: true
        content:
          application/xml:
            schema: {type: string}
            example: '<ussdAppRequest><msisdn>26658123456</msisdn><sessionId>demo-1</sessionId><network>VOD</network><type>initial</type><code>*123#</code></ussdAppRequest>'
      responses:
        '200':
          description: XML ussdAppResponse containing prompt, responseType string and state NextState or End
          content:
            application/xml:
              schema: {type: string}
        '400': {description: Malformed or ambiguous callback XML}
        '401': {description: Missing or incorrect gateway credential}
        '503': {description: State store unavailable or concurrent request busy}
  /ussd/callback/grapevine/inspect:
    post:
      operationId: inspectGrapevineCallback
      description: |
        Developer inspection using the same gateway key, XML parser, engine and deduplication as the MNO callback.
        Returns the XML reply plus request-local downstream diagnostics. Credentials, tokens, PINs and personal fields
        are redacted. Nothing is persisted or logged. A cached callback may have no new downstream exchanges.
        LOCAL entries describe JWT verification and do not represent additional HTTP requests.
      requestBody:
        required: true
        content:
          application/xml:
            schema: {type: string}
      responses:
        '200':
          description: Inspected callback; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [responseXml, exchanges]
                properties:
                  responseXml: {type: string}
                  exchanges:
                    type: array
                    items:
                      type: object
                      properties:
                        stage: {enum: [application-token, create-owner, pin-login, signing-keys, verify-owner-token, register-business]}
                        method: {enum: [POST, GET, LOCAL]}
                        url: {type: string}
                        httpStatus: {type: integer, description: Zero for a local check or when no HTTP response arrived}
                        durationMs: {type: integer}
                        requestHeaders: {type: object, additionalProperties: {type: string}}
                        requestBody: {}
                        responseBody: {}
                        outcome: {type: string}
        '400': {description: Malformed or ambiguous callback XML}
        '401': {description: Missing or incorrect gateway credential}
        '503': {description: State store unavailable or concurrent request busy}
  /ussd/callback/simulator:
    post:
      operationId: simulateCallback
      description: Available only in the dev profile. Input is the latest answer, not accumulated text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, sessionId, mobileNumber, event]
              properties:
                network: {type: string, minLength: 1, maxLength: 32}
                sessionId: {type: string, minLength: 1, maxLength: 128}
                mobileNumber: {type: string}
                event: {enum: [START, INPUT, ABORT]}
                input: {type: string, maxLength: 256}
                serviceCode: {type: string}
                requestId: {type: string, maxLength: 128}
      responses:
        '200':
          description: Next screen or terminal message
          content:
            application/json:
              schema:
                type: object
                required: [message, end]
                properties:
                  message: {type: string}
                  end: {type: boolean}
        '400': {description: Invalid callback}
        '401': {description: Missing or incorrect gateway credential}
components:
  securitySchemes:
    gatewayKey: {type: apiKey, in: header, name: X-Gateway-Key}
