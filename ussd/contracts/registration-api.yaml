                  "1000_9999",
                  "10000_49999",
                  "50000_plus"
                ],
                "description": "Monthly turnover (M)"
              },
              "other_description": {
                "type": "string",
                "maxLength": 250,
                "description": "Describe Other (if selected)"
              },
              "selling_price_range": {
                "type": "string",
                "enum": [
                  "below_100",
                  "100_499",
                  "500_999",
                  "1000_9999",
                  "10000_49999",
                  "50000_plus"
                ],
                "description": "Selling price of output (M)"
              },
              "farmland_count": {
                "oneOf": [
                  {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 1000000
                  },
                  {
                    "type": "string",
                    "pattern": "^[0-9]+$"
                  }
                ],
                "description": "Number of farmland plots (0 if none)"
              },
              "farmland_size": {
                "type": "string",
                "pattern": "^[0-9]+(\\.[0-9]+)?$",
                "description": "Total farmland size"
              },
              "farmland_unit": {
                "type": "string",
                "enum": [
                  "hectares",
                  "acres",
                  "square_metres",
                  ""
                ],
                "description": "Required when farmland_count is positive. Empty or omitted when count and size are zero; existing zero-land payloads with a valid unit remain accepted."
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "farmland_count": {
                      "not": {
                        "anyOf": [
                          {
                            "const": 0
                          },
                          {
                            "type": "string",
                            "pattern": "^0+$"
                          }
                        ]
                      }
                    }
                  }
                },
                "then": {
                  "required": [
                    "farmland_unit"
                  ],
                  "properties": {
                    "farmland_unit": {
                      "enum": [
                        "hectares",
                        "acres",
                        "square_metres"
                      ]
                    }
                  }
                }
              }
            ]
          },
          "businessName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 250
          },
          "source": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "channel",
              "language"
            ],
            "properties": {
              "channel": {
                "const": "USSD"
              },
              "language": {
                "enum": [
                  "en",
                  "st"
                ]
              }
            }
          },
          "livestock": {
            "type": "array",
            "minItems": 0,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "animal_type",
                "number"
              ],
              "properties": {
                "animal_type": {
                  "type": "string",
                  "maxLength": 250,
                  "minLength": 1,
                  "description": "Type of livestock"
                },
                "number": {
                  "oneOf": [
                    {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 1000000
                    },
                    {
                      "type": "string",
                      "pattern": "^[0-9]+$"
                    }
                  ],
                  "description": "Number of animals"
                }
              }
            }
          },
          "employees": {
            "type": "array",
            "minItems": 0,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "salary_range"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "maxLength": 250,
                  "minLength": 1,
                  "description": "Employee\u2019s full names"
                },
                "salary_range": {
                  "type": "string",
                  "enum": [
                    "below_500",
                    "500_999",
                    "1000_9999",
                    "10000_19999",
                    "20000_plus"
                  ],
                  "description": "Monthly salary (M)"
                }
              }
            }
          }
        }
      },
      "Registration": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/transport"
          },
          {
            "$ref": "#/components/schemas/services"
          },
          {
            "$ref": "#/components/schemas/ecommerce"
          },
          {
            "$ref": "#/components/schemas/retail"
          },
          {
            "$ref": "#/components/schemas/agriculture"
          }
        ],
        "description": "Other requires other_description; farming requires positive land count/size; livestock activity requires livestock rows. Count and size are both zero or both positive. End time <= start time requires overnight=true. Monthly salary/turnover; LSL currency."
      },
      "Registered": {
        "type": "object",
        "required": [
          "entityId",
          "reference"
        ],
        "properties": {
          "entityId": {
            "type": "string",
            "format": "uuid"
          },
          "reference": {
            "type": "string",
            "maxLength": 64
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "fields"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "fields": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        }
      }
    }
  }
}
