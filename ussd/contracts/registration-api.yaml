                "description": "Working days"
              },
              "opens_at": {
                "type": "string",
                "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$",
                "description": "Work starts"
              },
              "closes_at": {
                "type": "string",
                "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$",
                "description": "Work ends"
              },
              "overnight": {
