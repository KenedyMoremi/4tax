{
  "openapi": "3.1.0",
  "info": {
    "title": "4Tax Five-Sector Registration API",
    "version": "2.0.0",
    "description": "Implemented by Django business_profiles. Replaces the legacy three-sector mock contract."
  },
  "servers": [
    {
      "url": "https://4tax.vercel.app"
    }
  ],
  "paths": {
    "/api/v1/registration/options": {
      "get": {
        "summary": "Public sector menu definitions",
        "responses": {
          "200": {
            "description": "Schema version 2 field definitions and repeatable collections"
          }
        }
      }
    },
    "/api/v1/businesses": {
      "post": {
        "operationId": "createBusiness",
        "description": "Ownership is derived only from verified JWT issuer and UUID sub. Persist retries by issuer, subject and Idempotency-Key. Payload changes with the same key return 409. Registrations do not create web accounts or bookkeeping entries.",
        "security": [
          {
            "ownerJwt": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9._:-]{1,128}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Registration"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Identical retry",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Registered"
                }
              }
            }
          },
          "201": {
            "description": "Registration saved",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Registered"
                }
              }
            }
          },
          "400": {
            "description": "Invalid JSON or idempotency key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Invalid owner token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Owner kind/scope required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Idempotency payload conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Payload exceeds 16384 bytes",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "JSON required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Field validation failed; no creation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Unavailable; retry with same key and payload",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "get": {
        "operationId": "listOwnedBusinesses",
        "description": "Requires businesses:read. Returns only entities matching the verified issuer and subject; does not provision ledger accounts.",
        "security": [
          {
            "ownerJwt": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "page",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "At most five entities and an optional next page",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "businesses",
                    "nextPage"
                  ],
                  "properties": {
                    "businesses": {
                      "type": "array",
                      "maxItems": 5,
                      "items": {
                        "type": "object",
                        "required": [
                          "entityId",
                          "reference",
                          "sector",
                          "businessName"
                        ],
                        "properties": {
                          "entityId": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "reference": {
                            "type": "string"
                          },
                          "sector": {
                            "enum": [
                              "transport",
                              "services",
                              "ecommerce",
                              "retail",
                              "agriculture"
                            ]
                          },
                          "businessName": {
                            "type": "string"
                          }
                        }
                      }
                    },
                    "nextPage": {
                      "type": [
                        "integer",
                        "null"
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Invalid owner JWT"
          },
          "403": {
            "description": "Missing businesses:read scope"
          }
        }
      }
    }
  },
  "components": {
