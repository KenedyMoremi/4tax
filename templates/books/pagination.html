{% load books_tags %}{% if page.paginator.count %}<div class="flex flex-wrap items-center justify-between gap-3 border-t border-gray-100 px-5 py-4 text-sm text-gray-500"><span>Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span><div class="flex items-center gap-3">{% if page.has_previous %}<a class="btn-secondary py-1.5" href="{% page_url page.previous_page_number %}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn-secondary py-1.5" href="{% page_url page.next_page_number %}">Next</a>{% endif %}</div></div>{% endif %}
