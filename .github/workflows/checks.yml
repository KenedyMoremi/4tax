name: Django checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build:css
      - run: node --test scripts/test_pwa.cjs
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py export_registration_schema --check
      - run: python manage.py test
      - run: python bookkeeping/scripts/check_concurrency.py
  registration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: registration_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REGISTRATION_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/registration_tests?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test business_profiles.test_registration_api business_profiles.test_registration_concurrency business_profiles.test_ussd_transactions business_profiles.test_release_schema config.tests.test_vercel_build whatsapp bookings pos --settings=config.registration_postgres_test_settings
