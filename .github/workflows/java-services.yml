name: Java service checks
on:
  push:
    paths: ['auth/**', 'ussd/**', 'ussd-emulator/**', '.github/workflows/java-services.yml']
  pull_request:
    paths: ['auth/**', 'ussd/**', 'ussd-emulator/**', '.github/workflows/java-services.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ussd, ussd-emulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: ${{ matrix.service }}
